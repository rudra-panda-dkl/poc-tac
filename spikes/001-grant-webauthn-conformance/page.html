<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TAC ceremony-two conformance spike</title>
  </head>
  <body>
    <script>
      function b64urlToBuf(b64url) {
        const b64 = b64url.replace(/-/g, "+").replace(/_/g, "/");
        const bin = atob(b64);
        const buf = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
        return buf;
      }
      function bufToB64url(buf) {
        let bin = "";
        const bytes = new Uint8Array(buf);
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      }

      // Stands in for the out-of-scope passkey registration precondition (spec.md: "a
      // registered passkey with the RP" already exists before this feature's flow begins).
      window.__registerPrecondition = async function () {
        const cred = await navigator.credentials.create({
          publicKey: {
            rp: { name: "TAC Spike RP", id: "localhost" },
            user: {
              id: crypto.getRandomValues(new Uint8Array(16)),
              name: "spike-user",
              displayName: "Spike User",
            },
            challenge: crypto.getRandomValues(new Uint8Array(32)),
            pubKeyCredParams: [{ type: "public-key", alg: -7 }],
            authenticatorSelection: { userVerification: "required" },
            timeout: 10000,
          },
        });
        return bufToB64url(cred.rawId);
      };

      // This is the function under test: ceremony two. `challengeB64url` is computed
      // entirely client-side (JCS digest of the assembled credential — research.md §1) with
      // NO fresh server round-trip between ceremony one and this call, per FR-004.
      window.__ceremonyTwo = async function (credentialIdB64url, challengeB64url) {
        const assertion = await navigator.credentials.get({
          publicKey: {
            rpId: "localhost",
            challenge: b64urlToBuf(challengeB64url),
            allowCredentials: [
              { type: "public-key", id: b64urlToBuf(credentialIdB64url) },
            ],
            userVerification: "required",
            timeout: 10000,
          },
        });
        return {
          id: assertion.id,
          clientDataJSON: JSON.parse(new TextDecoder().decode(assertion.response.clientDataJSON)),
        };
      };
    </script>
  </body>
</html>
